[package]
name = "rsspell"
version = "0.1.10"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Fast and efficient spell checker"
license = "MIT"
repository = "https://github.com/veltzer/rsspell"

[dependencies]
pulldown-cmark = "0.13"
svg = "0.17"
walkdir = "2"
regex = "1"
zspell = "0.5.5"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "charset", "http2"] }
serde_json = "1.0"
anyhow = "1.0"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
